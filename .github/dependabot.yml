version: 2
updates:
  - package-ecosystem: "nuget"
    # Add new projects here so Dependabot updates them
    directories:
      - "/API"
      - "/Application"
      - "/Domain"
      - "/Infrastructure"
      - "/Persistence"
      - "/tests/API.IntegrationTests"
      - "/tests/Application.UnitTests"
      - "/tests/Authorization.UnitTests"
      - "/tests/Domain.UnitTests"
      - "/tests/EndToEnd.Tests"
    schedule:
      interval: "monthly"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/client-app"
    schedule:
      interval: "monthly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-refresh"
        versions: [">=0.5.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
